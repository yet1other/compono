[package]
name = "compono-gpui"
description = "Connects a Compono tree to GPUI"
version = "0.1.0-rc"
edition.workspace = true
# Its own minimum, checked by CI. It cannot be lower than `compono`'s, and GPUI
# (`gpui-pre =0.3.12`) builds with it. Raise it on its own when GPUI needs more.
rust-version = "1.96"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["compono", "gpui", "ui", "navigation"]
categories = ["gui"]

[dependencies]
compono = { version = "1.0.0-rc", path = "../compono" }
compono-desktop = { version = "1.0.0-rc", path = "../compono-desktop" }
compono-motion = { version = "1.0.0-rc", path = "../compono-motion" }
gpui = { package = "gpui-pre", version = "=0.3.12" }

[dev-dependencies]
compono-test = { version = "1.0.0-rc", path = "../compono-test" }
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }

[lints]
workspace = true
